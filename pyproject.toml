[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "toyrepair"
version = "0.0.1"
description = "Agentic policy repair harness on the toypref flow toy (TOY_PLAN.md)"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pandas", "matplotlib", "scikit-learn"]

[project.scripts]
toyrepair-tool = "toyrepair.cli:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["toyrepair*", "toypref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
